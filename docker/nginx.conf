server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ES modules and the worker must be served as JavaScript
    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js mjs;
        image/svg+xml             svg;
    }

    gzip on;
    gzip_types text/css text/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # No build step means no hashed file names, so revalidate on every load
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
